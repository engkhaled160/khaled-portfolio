backend:
  name: github
  repo: engkhaled160/khaled-portfolio
  branch: main
  base_url: https://khaled-portfolio-2026.engkhaled160.workers.dev

locale: "ar"
media_folder: "uploads"
public_folder: "uploads"

collections:
  - name: "certifications"
    label: "الشهادات"
    label_singular: "شهادة"
    files:
      - name: "certifications"
        label: "كل الشهادات (إضافة / تعديل / حذف)"
        file: "data/certifications.json"
        fields:
          - name: "certifications"
            label: "الشهادات"
            label_singular: "شهادة"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "اسم الشهادة (عربي)", name: "name", widget: "string" }
              - { label: "Certificate Name (English)", name: "nameEn", widget: "string", required: false }
              - { label: "الجهة المانحة (عربي)", name: "issuer", widget: "string", required: false }
              - { label: "Issuer (English)", name: "issuerEn", widget: "string", required: false }
              - label: "صورة الشهادة (اختياري)"
                name: "image"
                widget: "image"
                required: false
                media_folder: "uploads/certs"
                public_folder: "uploads/certs"
              - { label: "تاريخ الإصدار (مثال: May 2026)", name: "date", widget: "string", required: false }
              - { label: "تاريخ الانتهاء (اختياري)", name: "expiry", widget: "string", required: false }
              - { label: "رقم الشهادة (اختياري)", name: "number", widget: "string", required: false }
              - { label: "رابط التحقق (اختياري)", name: "url", widget: "string", required: false }

  - name: "projects"
    label: "المشاريع"
    label_singular: "مشروع"
    files:
      - name: "projects"
        label: "كل المشاريع (إضافة / تعديل / حذف)"
        file: "data/projects.json"
        fields:
          - name: "projects"
            label: "المشاريع"
            label_singular: "مشروع"
            widget: "list"
            summary: "{{fields.name}} — {{fields.location}}"
            fields:
              - { label: "اسم المشروع (عربي)", name: "name", widget: "string" }
              - { label: "Project Name (English)", name: "nameEn", widget: "string" }
              - label: "تصنيف المشروع"
                name: "type"
                widget: "select"
                options:
                  - { label: "فيلا / قسيمة", value: "villa" }
                  - { label: "مبنى", value: "building" }
                  - { label: "مبنى شاهق / برج", value: "highrise" }
                  - { label: "خزان", value: "tanks" }
                  - { label: "أخرى", value: "other" }
              - label: "حالة المشروع"
                name: "status"
                widget: "select"
                options:
                  - { label: "جاري التنفيذ", value: "active" }
                  - { label: "منتهي", value: "completed" }
                  - { label: "متوقف", value: "paused" }
              - { label: "الموقع (عربي)", name: "location", widget: "string" }
              - { label: "Location (English)", name: "locationEn", widget: "string" }
              - { label: "تاريخ البداية (مثال 01/08/2026)", name: "date", widget: "string", required: false }
              - { label: "الشركة المنفذة", name: "company", widget: "string", required: false }
              - { label: "الوصف (عربي)", name: "desc", widget: "text" }
              - { label: "Description (English)", name: "descEn", widget: "text" }
              - label: "صورة الغلاف"
                name: "cover"
                widget: "image"
                required: false
                media_folder: "uploads/covers"
                public_folder: "uploads/covers"
              - label: "وسوم (اختياري)"
                name: "tags"
                widget: "list"
                required: false
                field: { label: "وسم", name: "tag", widget: "string" }
              - label: "تحديثات المشروع (الجدول الزمني)"
                name: "updates"
                widget: "list"
                required: false
                summary: "{{fields.date}} — {{fields.text}}"
                fields:
                  - label: "نوع التحديث"
                    name: "type"
                    widget: "select"
                    default: "update"
                    options:
                      - { label: "📝 تحديث يومي", value: "update" }
                      - { label: "🔴 درس مستفاد", value: "lesson" }
                      - { label: "✅ إنجاز", value: "milestone" }
                  - { label: "التاريخ (اختياري)", name: "date", widget: "string", required: false }
                  - { label: "اسم البند (مثال: أساسات، بياض...)", name: "band", widget: "string", required: false }
                  - { label: "نص التحديث", name: "text", widget: "text", required: false }
                  - { label: "ظاهر للزوار", name: "public", widget: "boolean", default: true }
                  - label: "صور التحديث"
                    name: "photos"
                    widget: "list"
                    required: false
                    field:
                      label: "صورة"
                      name: "photo"
                      widget: "image"
                      media_folder: "uploads/updates"
                      public_folder: "uploads/updates"
